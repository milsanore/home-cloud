# http-level hardening for nginx-proxy (mounted read-only from home-cloud/config)

# don't advertise nginx / PHP versions
server_tokens off;
proxy_hide_header X-Powered-By;

# brute-force throttle for wp-login.php (applied in vhost.d/mils.dev)
limit_req_zone $binary_remote_addr zone=wp_login:1m rate=10r/m;
