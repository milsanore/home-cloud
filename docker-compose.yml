# NB:
# docker-compose automagically loads environment variables defined in an `.env` file
# router will route ports: [ 80, 443 ]

volumes:
  mariadb:
  nextcloud:
  wordpress:
  # proxy
  proxy-certs:
  proxy-conf:
  proxy-dhparam:
  proxy-html:
  proxy-vhost:
  # proxy-acme
  acme-acme:

services:

  proxy:
    container_name: proxy
    image: nginxproxy/nginx-proxy:latest
    restart: always
    volumes:
      - proxy-certs:/etc/nginx/certs
      - proxy-conf:/etc/nginx/conf.d
      - proxy-dhparam:/etc/nginx/dhparam
      - proxy-html:/usr/share/nginx/html
      - proxy-vhost:/etc/nginx/vhost.d
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - proxy-tier
    ports:
      - 80:80
      - 443:443

  acme:
    container_name: proxy-acme
    image: nginxproxy/acme-companion:latest
    restart: always
    depends_on:
      - proxy
    volumes_from:
      - proxy
    volumes:
      - acme-acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: ${EMAIL}
    networks:
      - proxy-tier

  db:
    container_name: db
    # LTS series; follows patch releases on pull (see README: UPGRADE)
    image: mariadb:12.3
    restart: always
    # the pi has ~1GB RAM: cap the innodb cache (default 128M)
    command: --innodb-buffer-pool-size=64M
    environment:
      # only used when the db is first initialised
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      # run mariadb-upgrade automatically after a version bump
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_root_password
    # ports:
    #   - 3306:3306

  nextcloud:
    container_name: nextcloud
    image: nextcloud:35-apache
    restart: always
    environment:
      - PORT=80
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=nc.${DOMAIN}
      - LETSENCRYPT_HOST=nc.${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
      - OVERWRITEPROTOCOL=https
      - MYSQL_HOST=db
      - MYSQL_USER=nextclouduser
      - MYSQL_PASSWORD_FILE=/run/secrets/db_nextcloud_password
      - MYSQL_DATABASE=nextcloud
      # only used for the automatic install on an empty volume
      - NEXTCLOUD_ADMIN_USER=miki
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nextcloud_admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=nc.${DOMAIN}
    volumes:
      - nextcloud:/var/www/html
    depends_on:
      - db
      # - proxy-acme
    networks:
      - proxy-tier
      - default
    secrets:
      - db_nextcloud_password
      - nextcloud_admin_password

  wordpress:
    container_name: wordpress
    # PHP + apache only: the wordpress code lives in the volume and updates itself
    image: wordpress:php8.4-apache
    restart: always
    environment:
      - PORT=80
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpressuser
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_wordpress_password
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - db
      # - proxy-acme
    networks:
      - proxy-tier
      - default
    secrets:
      - db_wordpress_password

networks:
  proxy-tier:

secrets:
  db_root_password:
    file: secrets/db_root_password
  db_nextcloud_password:
    file: secrets/db_nextcloud_password
  db_wordpress_password:
    file: secrets/db_wordpress_password
  nextcloud_admin_password:
    file: secrets/nextcloud_admin_password
