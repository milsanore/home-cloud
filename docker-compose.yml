# NB:
# docker-compose automagically loads environment variables defined in an `.env` file
# router will route ports: [ 80, 443 ]

volumes:
  mariadb:
  nextcloud:
  wordpress:
  # proxy
  proxy-certs:
  proxy-conf:
  proxy-dhparam:
  proxy-html:
  proxy-vhost:
  # proxy-acme
  acme-acme:

services:

  # read-only docker API for the internet-facing proxy (instead of the raw socket)
  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest
    restart: always
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
      - INFO=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  proxy:
    container_name: proxy
    image: nginxproxy/nginx-proxy:latest
    restart: always
    depends_on:
      - socket-proxy
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # nothing sits in front of us (the router only NATs): don't pass client-supplied X-Forwarded-* on
      TRUST_DOWNSTREAM_PROXY: "false"
    volumes:
      - proxy-certs:/etc/nginx/certs
      - proxy-conf:/etc/nginx/conf.d
      - proxy-dhparam:/etc/nginx/dhparam
      - proxy-html:/usr/share/nginx/html
      - proxy-vhost:/etc/nginx/vhost.d
      # hardening, tracked in git
      - ./config/nginx/conf.d/00-security.conf:/etc/nginx/conf.d/00-security.conf:ro
      - ./config/nginx/vhost.d/mils.dev:/etc/nginx/vhost.d/mils.dev:ro
    networks:
      - proxy-tier
      - socket-proxy
    ports:
      - 80:80
      - 443:443

  acme:
    container_name: proxy-acme
    image: nginxproxy/acme-companion:latest
    restart: always
    depends_on:
      - proxy
    volumes_from:
      - proxy
    volumes:
      - acme-acme:/etc/acme.sh
      # acme-companion needs exec/kill on the proxy container, so a socket proxy would not reduce its power
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      NGINX_PROXY_CONTAINER: proxy
      DEFAULT_EMAIL: ${EMAIL}
    networks:
      - proxy-tier

  db:
    container_name: db
    # LTS series; follows patch releases on pull (see README: UPGRADE)
    image: mariadb:12.3
    restart: always
    # the pi has ~1GB RAM: cap the innodb cache (default 128M)
    command: --innodb-buffer-pool-size=64M --local-infile=0
    environment:
      # only used when the db is first initialised
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
      - MARIADB_ROOT_HOST=localhost
      # run mariadb-upgrade automatically after a version bump
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_root_password
    # ports:
    #   - 3306:3306

  nextcloud:
    container_name: nextcloud
    image: nextcloud:35-apache
    restart: always
    environment:
      - PORT=80
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=nc.${DOMAIN}
      - LETSENCRYPT_HOST=nc.${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
      - OVERWRITEPROTOCOL=https
      # requests arrive via the proxy on proxy-tier: trust its X-Forwarded-For for the real client ip
      - TRUSTED_PROXIES=172.18.0.0/16
      - FORWARDED_FOR_HEADERS=HTTP_X_FORWARDED_FOR
      - MYSQL_HOST=db
      - MYSQL_USER=nextclouduser
      - MYSQL_PASSWORD_FILE=/run/secrets/db_nextcloud_password
      - MYSQL_DATABASE=nextcloud
      # only used for the automatic install on an empty volume
      - NEXTCLOUD_ADMIN_USER=miki
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nextcloud_admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=nc.${DOMAIN}
    volumes:
      - nextcloud:/var/www/html
    depends_on:
      - db
      # - proxy-acme
    networks:
      - proxy-tier
      - default
    secrets:
      - db_nextcloud_password
      - nextcloud_admin_password

  wordpress:
    container_name: wordpress
    # PHP + apache only: the wordpress code lives in the volume and updates itself
    image: wordpress:php8.4-apache
    restart: always
    environment:
      - PORT=80
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=${DOMAIN}
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${EMAIL}
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=wordpressuser
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/db_wordpress_password
      - WORDPRESS_DB_NAME=wordpress
      # no theme/plugin code editor in wp-admin
      - WORDPRESS_CONFIG_EXTRA=define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress:/var/www/html
      # hardening, tracked in git
      - ./config/wordpress/mu-plugins/hardening.php:/var/www/html/wp-content/mu-plugins/hardening.php:ro
    depends_on:
      - db
      # - proxy-acme
    networks:
      - proxy-tier
      - default
    secrets:
      - db_wordpress_password

networks:
  proxy-tier:
  socket-proxy:
    internal: true

secrets:
  db_root_password:
    file: secrets/db_root_password
  db_nextcloud_password:
    file: secrets/db_nextcloud_password
  db_wordpress_password:
    file: secrets/db_wordpress_password
  nextcloud_admin_password:
    file: secrets/nextcloud_admin_password
